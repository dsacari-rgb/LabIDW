<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Universitarias</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tarea-completada {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0">Gestor de Tareas Universitarias</h1>
                </div>
                <div class="card-body">

                    <!-- Mensaje de alerta para validación -->
                    <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

                    <!-- Formulario de tareas -->
                    <form id="form-tarea" class="mb-4">
                        <div class="row g-2">
                            <div class="col-md-4">
                                <input type="text" id="titulo" class="form-control" placeholder="Título de tarea">
                            </div>
                            <div class="col-md-4">
                                <input type="text" id="curso" class="form-control" placeholder="Nombre del curso">
                            </div>
                            <div class="col-md-4">
                                <input type="date" id="fecha" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3 w-100">Agregar Tarea</button>
                    </form>

                    <!-- Filtros de tareas -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Mis Tareas</h2>
                        <div class="btn-group btn-group-sm" id="filtros">
                            <button class="btn btn-outline-primary active" data-filtro="todas">Todas</button>
                            <button class="btn btn-outline-primary" data-filtro="pendientes">Pendientes</button>
                            <button class="btn btn-outline-primary" data-filtro="completadas">Completadas</button>
                        </div>
                    </div>

                    <!-- Lista donde se mostrarán las tareas -->
                    <ul id="lista-tareas" class="list-group"></ul>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
